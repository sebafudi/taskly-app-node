# Publishes the verification gate's results on the pull request.
#
# Runs from the default branch after "Unit test agent" completes, so the code that renders and
# posts the report is trusted. It never checks out or executes pull request code: it only reads
# the JSON artifact written by the gate and renders it with escaping for PR-controlled strings.
name: Unit test agent report

on:
  workflow_run:
    workflows: ["Unit test agent"]
    types: [completed]

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Check out trusted report tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/test-agent
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download verification report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-agent-verification
          path: ${{ runner.temp }}/verification
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update the verification comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          report="$RUNNER_TEMP/verification/verification.json"
          if [ ! -f "$report" ]; then
            echo "No verification report in the run (the agent made no changes)."
            exit 0
          fi
          node tools/test-agent/src/cli.mjs report --in "$report" --run-url "$RUN_URL" > "$RUNNER_TEMP/body.md"
          marker='<!-- unit-test-agent:verification -->'
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/body.md" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/body.md" >/dev/null
          fi
